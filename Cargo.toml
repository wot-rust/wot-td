[package]
name = "wot-td"
version = "0.6.2"
edition = "2021"
description = "Web of Things (WoT) Thing Description manipulation"
license = "MIT"
repository = "https://github.com/wot-rust/wot-td"
keywords = ["wot", "WebofThings"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "serde_with/std", "time/std", "oxilangtag/std", "hashbrown/allocator-api2", "thiserror/std"]
alloc = ["serde/alloc", "serde_json/alloc", "serde_with/alloc", "time/alloc", "oxilangtag/alloc", "hashbrown/allocator-api2"]

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["serde", "default-hasher", "inline-more", "equivalent"] }
oxilangtag = { version = "0.1.6", features = ["serialize"], default-features = false }
serde = { version = "1.0.229", features = ["derive", "alloc"], default-features = false }
serde_json = { version = "1.0.154", features = ["alloc"], default-features = false }
serde_repr = "0.1.21"
serde_with = { version = "3.25.0", default-features = false, features = ["macros", "alloc"] }
thiserror = { version = "2.0.21", default-features = false }
time = { version = "0.3.55", features = ["serde", "parsing"], default-features = false }

[dev-dependencies]
pretty_assertions = "1.4.1"
time = { version = "0.3.55", features = ["macros"] }
